ciktilar:
  MAT.6.1.1:
    metin: Karşılaştığı problem durumlarında bir doğal sayının çarpan ve katlarına yönelik muhakeme yapabilme
    beceri: MAB1, KB2.10
    bilesenler:
      a:
        ad: Çarpan ve katlara yönelik varsayımda bulunma
        basamak: KB2.10.SB1
        birebir: Karşılaştığı durumlarda bir doğal sayının çarpan ve katlarına yönelik varsayımlarda bulunur.
      b:
        ad: Örnek durumlardan genellemeleri belirleme
        basamak: KB2.10.SB2
      c:
        ad: Genellemeyi modellerle gösterme
        basamak: KB2.10.SB3
        birebir: Elde ettiği genellemelerin varsayımını karşılayıp karşılamadığını çeşitli modellerle gösterir.
      ç:
        birebir: Varsayımı ile ilgili ulaştığı sonuca yönelik doğrulayabileceği matematiksel bir önermeyi sözel ya da sembolik temsil ile sunar.
        ad: Önermeyi sözel ya da sembolik sunma
        basamak: KB2.10.SB4
      d:
        ad: Önermenin gerekçelerini sunma
        basamak: KB2.10.SB4
        birebir: Farklı problemlerin pratik yoldan çözümüne yönelik oluşturduğu önermenin gerekçelerini sunar.
      e:
        ad: Kapsayıcı örnekler verme
        basamak: KB2.10.SB4
        birebir: Önermenin geçerliliğini destekleyen kapsayıcı örnekler verir.
      f:
        ad: Doğrulamanın benzer önermelere uygulanabilirliğini değerlendirme
        basamak: KB2.10.SB5
        birebir: İşe koştuğu doğrulamanın benzer önermelere uygulanıp uygulanamayacağını değerlendirir.
  MAT.6.1.2:
    metin: Bir doğal sayının 2, 3, 4, 5, 6, 9 ve 10 ile tam bölünebilme kriterlerine ilişkin çıkarım yapabilme
    beceri: MAB1, KB2.10
    bilesenler:
      a:
        ad: Bölünebilmeye ilişkin varsayımda bulunma
        basamak: KB2.10.SB1
      b:
        ad: Katlar ve basamak değerlerinden genelleme belirleme
        basamak: KB2.10.SB2
      c:
        ad: Genellemeleri örneklerle sınama
        basamak: KB2.10.SB3
      ç:
        ad: Bölünebilme kriterine ilişkin önerme sunma
        basamak: KB2.10.SB4
      d:
        ad: Kriterlerin kullanışlılığını değerlendirme
        basamak: KB2.10.SB5
  MAT.6.1.3:
    metin: Bir doğal sayının asal olma durumunu ve asal çarpanlarını çözümleyebilme
    beceri: MAB1, KB2.4
    bilesenler:
      a:
        ad: Asallığı ve asal çarpanları belirleme
        basamak: KB2.4.SB1
      b:
        ad: Asal sayıların özelliklerini ve ilişkileri belirleme
        basamak: KB2.4.SB2
  MAT.6.1.4:
    metin: Günlük hayat problemleri ya da matematiksel durumlar üzerinden ortak kat ve ortak böleni yorumlayabilme
    beceri: MAB1, KB2.4, KB2.14
    bilesenler:
      a:
        ad: Ortak kat ve ortak bölenleri inceleme
        basamak: KB2.4.SB1
      b:
        ad: Ortak kat ilişkisini temsillerle ifade etme
        basamak: KB2.14.SB2
      c:
        ad: Ortak katları kendi ifadeleriyle açıklama
        basamak: KB2.14.SB3
  MAT.6.1.5:
    metin: Gerçek yaşam durumlarında ondalık gösterimlerin basamak değerlerini kesirlerden yararlanarak yorumlayabilme
    uygulama_islemleri:
    - islem: ondalıkları belirlenen basamağa kadar yuvarlama
      birebir: Öğrencilerden boş sayı doğrusundan yararlanarak ondalıkları belirlenen basamağa kadar yuvarlama çalışmaları yapmaları istenir.
      kaynak: https://tymm.meb.gov.tr/ortaokul-matematik-dersi/unite/457 (12.11.2026)
    beceri: MAB2, KB2.14
    bilesenler:
      a:
        birebir: Ondalık gösterimlerin basamak değerlerini inceler.
        ad: Basamak değerlerini inceleme
        basamak: KB2.14.SB2
      b:
        birebir: Ondalık gösterimlerin basamak değerlerini paydası 10, 100 ve 1000 olan kesirlerin toplamlarını kullanarak yeniden ifade eder.
        ad: Kesirlerin toplamıyla yeniden ifade etme
        basamak: KB2.14.SB2
      c:
        birebir: Ondalık gösterimlerin basamak değerlerini kendi cümleleriyle açıklar.
        ad: Basamak değerlerini kendi cümleleriyle açıklama
        basamak: KB2.14.SB3
  MAT.6.6.1:
    metin: Bir olayın olasılığını gözleme dayalı tahmin edebilme
    icerik_terimleri: [Deneysel Olasılık]
    genelleme: Deneysel olasılık deneyden elde edilen veriye dayanır.
    beceri: KB2.11
    bilesenler:
      a:
        birebir: Bir olayın olasılığı ile deneylerden elde ettiği veriyi ilişkilendirir.
        ad: Olasılığı deney verisiyle ilişkilendirme
        basamak: KB2.11
      b:
        birebir: Deneye ait tekrar sayısı ile deneyin çıktılarının göreli sıklıklarının ilişkisine yönelik çıkarım yapar.
        ad: Tekrar sayısı ile göreli sıklık ilişkisine yönelik çıkarım
        basamak: KB2.11
      c:
        birebir: Çıkarımlardan hareketle olasılık değerini belirleme için göreli sıklığın kullanımına yönelik yargıda bulunur.
        ad: Göreli sıklığın kullanımına yönelik yargıda bulunma
        basamak: KB2.11
  MAT.6.1.6:
    metin: Kesir ve bölme işlemi arasındaki ilişkiye yönelik tümevarımsal akıl yürütebilme
    beceri: KB2.16.1
    bilesenler:
      a:
        ad: Ondalık gösterimleri gözlemleme
      b:
        ad: Sonlu ve devirli örüntüleri belirleme
      c:
        ad: İlişkiyi genelleme
  MAT.6.1.7:
    metin: Kesir, ondalık ve yüzde gösterimleri ile ilgili dört işlem gerektiren problemleri çözebilme
    beceri: MAB2
    bilesenler:
      a:
        ad: Sayı ve işlem bileşenlerini belirleme
      b:
        ad: Verilen, istenen ve işlem ilişkisini belirleme
      c:
        ad: Uygun temsili kullanma
      ç:
        ad: Problemi kendi ifadesiyle açıklama
      d:
        ad: Sonucu tahmin etme
      e:
        ad: Stratejiyle çözme
      f:
        ad: Stratejiyi değiştirme
      g:
        ad: Kısa yolları değerlendirme
      ğ:
        ad: Stratejiyi genelleme
      h:
        ad: Genellemenin geçerliliğini değerlendirme
  MAT.6.1.8:
    metin: Günlük hayat ya da matematiksel durumlarda standart uzunluk ölçme birimlerini değerlendirebilme
    beceri: KB2.17
    bilesenler:
      a:
        ad: Metreyi ölçüt olarak belirleme
      b:
        ad: Standart birimlerle ölçme
      c:
        ad: Sonuçları birimlerle karşılaştırma
      ç:
        ad: Karşılaştırmaya ilişkin yargıda bulunma
  MAT.6.5.1:
    metin: Kategorik veya nicel (kesikli) veri ile çalışabilme ve veriye dayalı karar verebilme
    beceri: MAB4
    bilesenler:
      a:
        ad: Araştırma gerektiren durumu fark etme
      b:
        ad: Araştırma sorusu oluşturma
      c:
        ad: Veriye ulaşmak için plan yapma
      ç:
        ad: Anketle ya da hazır veriyle veri toplama
      d:
        ad: Görselleştirme ve özetleme aracını seçme gerekçesi
      e:
        ad: Veriyi uygun araçlarla analiz etme
      f:
        ad: Sonuçlara gerekçe sunma
      g:
        ad: Sonucun araştırma sorusunu cevaplama düzeyini değerlendirme
  MAT.6.5.2:
    metin: Başkalarının kategorik veya nicel (kesikli) veriye dayalı sonuç ya da yorumlarını tartışabilme
    beceri: KB2.18
    bilesenler:
      a:
        ad: İstatistiksel temellendirme yapma
      b:
        ad: Hata ve yanlılıkları tespit etme
      c:
        ad: Sonuç ya da yorumu çürütme veya kabul etme
