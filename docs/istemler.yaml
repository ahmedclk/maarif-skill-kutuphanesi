    baslik: DNAMATHOS tasarım dili 2.0
    metin: Safran ve lacivert, Fraunces başlık, okunaklı Atkinson gövde, el yazısı notlar ve DNA sarmalı. Çözüm alanı sorunun altında, tüyo aynı sayfada.
  - tarih: 11 Kasım 2026
    baslik: Haftalık ders paketi
    metin: Konu özeti artık ısınma turunu, haftanın sloganını ve kavrama testini de üretiyor; ödev testin sonucuna bağlı.
  - tarih: 11 Kasım 2026
    baslik: Kavrama testi ve hızlı tekrar
    metin: Haftalık konuyu 4 soruyla ölçen test ve aralıklı tekrar yapan 5 dakikalık ders başı turu.
  - tarih: 11 Kasım 2026
    baslik: MEB ölçme kuralları
    metin: Ölçme ve Değerlendirme Yönetmeliği, Yönerge ve Kılavuzdaki 28 kural bütün ölçme skill'lerine işlendi.
  - tarih: 11 Kasım 2026
    baslik: İlk sürüm
    metin: Maarif Modeli'ne bağlı 15 skill, ortak başvurular, testler ve öğretmen kılavuzu.
ipuclari:
  - Önce çıktı kartını isteyin; aynı sohbette sonraki skill'ler onu kullanır, programı yeniden okumaz.
  - İstemde sınıfı ve konuyu söylemeniz yeter; gerisini skill varsayılanla doldurur ve teslimde yazar.
  - Ders kitabını ve kaynak kitabın içindekiler sayfasını ekleyin; ödev sayfaları yalnız oradan okunur, uydurulmaz.
  - Öğrenci adı vermeyin; skill'ler takma adla çalışır ve sıralama üretmez.
  - Bir şey beğenmezseniz yalnız o yeri söyleyin; skill bütün ürünü baştan yazmaz, o kısmı düzeltir.
  - Bir haftada yalnız özet istiyorsanız "yalnız özet" deyin; ısınma ve kavrama testi atlanır.
